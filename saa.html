<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sää Helsingissä</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Etusivu (Tehtävä 1 OSA 1)
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="toteutus.html">
              Tehtävä 1 OSA 2
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="pokemon.html">
              Poke haku (Tehtävä 2 OSA 1 ja 2)
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="saa.html">
              Tehtävä 3
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- Sivun sisältö -->
  <main class="container my-5">

    <h1>Sää Helsingissä</h1>

    <div id="vastaus"></div>

  </main>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <script>
    fetch("https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric")

      // Muutetaan vastaus JSON-muotoon
      .then(function(response) {
        return response.json();
      })

      // Käsitellään saatu tieto
      .then(function(data) {
        saa(data);
      })

      // Virhetilanne
      .catch(function(error) {
        document.getElementById("vastaus").innerHTML =
          "<p>Säätietoja ei pystytä hakemaan</p>";
      });

    function saa(data) {

      // Kellonaika
      let aika = new Date();
      let tunnit = aika.getHours();
      let minuutit = aika.getMinutes();

      if (minuutit < 10) {
        minuutit = "0" + minuutit;
      }

      // Sääikoni
      let ikoni = data.weather[0].icon;

      let tiedot =
        "<p>Sää kello " + tunnit + ":" + minuutit + "</p>" +

        "<h3>Sää:</h3>" +
        "<p>" + data.weather[0].description + "</p>" +

        "<h3>Lämpötila:</h3>" +
        "<p>" + data.main.temp + " °C</p>" +

        "<h3>Tuuli:</h3>" +
        "<p>" + data.wind.speed + " m/s</p>" +

        "<img src='https://openweathermap.org/img/wn/" +
        ikoni +
        "@2x.png'>";

      document.getElementById("vastaus").innerHTML = tiedot;
    }
  </script>

</body>

</html>
