<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JSON-tehtävät</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA 1)</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA 2</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="pokemon.html">Poke haku (Tehtävä 2 OSA 1 ja 2)</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="saa.html">Tehtävä 3</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- Sivun sisältö -->
  <main class="container my-5">

    <div id="vastaus"></div>

  </main>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <script>
    fetch("tietue.json")

      // Muunnetaan vastaus JSON-muotoon
      .then(function(response) {
        return response.json();
      })

      // Käsitellään JSON-vastaus
      .then(function(responseJson) {
        kerro(responseJson);
      })

      // Jos tiedon hakemisessa tulee virhe
      .catch(function(error) {
        document.getElementById("vastaus").innerHTML =
          "<p>Tietoa ei pystytä hakemaan</p>";
      });
  </script>

  <script>
    function kerro(obj) {

      // Haetaan otsikko ja kuvaus
      let tiedot =
        "<h1>" + obj.otsikko + "</h1>" +
        "<br>" +
        obj.kuvaus +
        "<br><hr>";

      // Lisätään kuva
      tiedot +=
        "<p><img src=" + obj.kuva + "></p>";

      // Lisätään opintojakson tiedot
      tiedot +=
        "<h3>Opintojakso</h3>" +
        "Nimi: " + obj.opintojakso.nimi + "<br>" +
        "Tunnus: " + obj.opintojakso.tunnus + "<br>" +
        "Opintopisteet: " + obj.opintojakso.opintopisteet + "<br>";

      // Aiheet-otsikko
      tiedot += "<h3>Aiheet</h3>";

      tiedot += "<p>";

      // Käydään tekniikat-taulukko läpi
      for (var i = 0; i < obj.tekniikat.length; i++) {

        tiedot +=
          "<b>Aihe: " + obj.tekniikat[i].aihe + "</b> ";

        tiedot +=
          "<a href='" + obj.tekniikat[i].linkki + "'>" +
          obj.tekniikat[i].linkki +
          "</a><br>";
      }

      tiedot += "</p>";

      // Kirjoitetaan tiedot sivulle
      document.getElementById("vastaus").innerHTML = tiedot;

    }
  </script>

</body>

</html>
